name: CI — Tests & Health Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run test coverage
        run: npm run test:coverage

      - name: Seed database and simulate health checks
        run: |
          cp .env.example .env
          node src/cli.js seed
          node src/cli.js health-check --simulate-days 5

      - name: Generate final report
        run: node src/cli.js report --final

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-reports-node${{ matrix.node-version }}
          path: reports/
          retention-days: 30
